document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bg:          #ffffff;\n    --bg-2:        #F7F8FB;\n    --bg-3:        #EEF0F5;\n    --line:        rgba(10,12,25,0.09);\n    --line-2:      rgba(10,12,25,0.17);\n    --ink:         #0A0C19;\n    --ink-2:       rgba(10,12,25,0.78);\n    --ink-3:       rgba(10,12,25,0.56);\n    --ink-4:       rgba(10,12,25,0.38);\n    --violet:      #C10008;\n    --violet-2:    #E11019;\n    --violet-glow: rgba(193, 0, 8, 0.38);\n    --cyan:        #0D3D6E;\n    --cyan-2:      #0B4E8A;\n    --whatsapp:    #25D366;\n    --whatsapp-2:  #1DA851;\n    --danger:      #F43F5E;\n    --ok:          #34D399;\n    --radius:      14px;\n    --maxw:        1240px;\n    --mono:        'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n    --display:     'Space Grotesk', Inter, system-ui, sans-serif;\n    --body:        Inter, system-ui, -apple-system, sans-serif;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{\n    background: var(--bg);\n    color: var(--ink);\n    font-family: var(--body);\n    font-size: 16px;\n    line-height: 1.55;\n    -webkit-font-smoothing: antialiased;\n    overflow-x: hidden;\n  }\n  a{color:inherit;text-decoration:none}\n  button{font-family:inherit;cursor:pointer}\n  input{font-family:inherit}\n  h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-0.02em;margin:0;line-height:1.08;color:var(--ink)}\n  h1{font-size: clamp(44px, 5.2vw, 76px); letter-spacing:-0.035em; font-weight:600}\n  h2{font-size: clamp(32px, 3.2vw, 48px); letter-spacing:-0.028em}\n  h3{font-size: 20px; letter-spacing:-0.01em}\n  p{margin:0;color:var(--ink-2)}\n\n  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}\n\n  /* ——— Ambient glow ——— */\n  .field{\n    position:fixed;inset:0;pointer-events:none;z-index:0;\n    background:\n      radial-gradient(1100px 600px at 82% -8%, rgba(193,0,8,0.10), transparent 60%),\n      radial-gradient(900px 500px at 6% 14%, rgba(13,61,110,0.06), transparent 65%),\n      radial-gradient(800px 600px at 50% 120%, rgba(193,0,8,0.05), transparent 60%);\n  }\n  .grid-bg{\n    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;\n    background-image:\n      linear-gradient(to right, rgba(10,12,25,0.04) 1px, transparent 1px),\n      linear-gradient(to bottom, rgba(10,12,25,0.04) 1px, transparent 1px);\n    background-size: 64px 64px;\n    mask-image: radial-gradient(ellipse at 50% 20%, black 20%, transparent 70%);\n  }\n  main, header{position:relative;z-index:1}\n\n  /* ——— Nav ——— */\n  .nav{\n    position:sticky;top:0;z-index:50;\n    background: color-mix(in oklab, var(--bg) 86%, transparent);\n    backdrop-filter: saturate(160%) blur(14px);\n    border-bottom:1px solid var(--line);\n  }\n  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px}\n  .logo img{height:46px;width:auto;display:block}\n  .nav-links{display:flex;gap:28px;color:var(--ink-3);font-size:14px}\n  .nav-links a:hover{color:var(--ink)}\n  .nav-right{display:flex;align-items:center;gap:12px}\n  .nav-badge{\n    font-family:var(--mono);font-size:11px;color:var(--ink-3);\n    padding:6px 10px;border:1px solid var(--line);border-radius:999px;\n    display:flex;align-items:center;gap:6px;\n  }\n  .nav-badge::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}\n  @media (max-width:1080px){.nav-links{display:none}}\n  @media (max-width:600px){.nav-badge{display:none}}\n\n  /* ——— Buttons ——— */\n  .btn{\n    display:inline-flex;align-items:center;justify-content:center;gap:8px;\n    padding:14px 22px;border-radius:10px;font-weight:500;font-size:15px;\n    border:1px solid transparent;transition: all .18s ease;\n    letter-spacing:-0.005em;cursor:pointer;\n  }\n  .btn-primary{\n    background: linear-gradient(180deg, #E11019 0%, #A20006 100%);\n    color:#fff;box-shadow: 0 10px 28px rgba(193,0,8,0.30), inset 0 1px 0 rgba(255,255,255,0.22);\n    border-color: rgba(255,255,255,0.14);\n  }\n  .btn-primary:hover{transform:translateY(-1px);box-shadow: 0 16px 38px rgba(193,0,8,0.45), inset 0 1px 0 rgba(255,255,255,0.32)}\n  .btn-ghost{background:rgba(10,12,25,0.03);border-color:var(--line-2);color:var(--ink)}\n  .btn-ghost:hover{background:rgba(10,12,25,0.06);border-color:var(--ink-3)}\n  .btn-wa{\n    background: linear-gradient(180deg, #2DD96F 0%, #1DA851 100%);\n    color:#fff;box-shadow: 0 10px 28px rgba(29,168,81,0.38), inset 0 1px 0 rgba(255,255,255,0.22);\n    border-color: rgba(255,255,255,0.14);\n  }\n  .btn-wa:hover{transform:translateY(-1px);box-shadow: 0 16px 36px rgba(29,168,81,0.52), inset 0 1px 0 rgba(255,255,255,0.35)}\n  .btn .arr{transition:transform .2s}\n  .btn:hover .arr{transform:translateX(3px)}\n\n  section{padding: 100px 0;position:relative}\n  .eyebrow{\n    display:inline-flex;align-items:center;gap:8px;\n    font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;\n    color:var(--violet);\n    padding:6px 12px;border:1px solid rgba(193,0,8,0.22);background:rgba(193,0,8,0.05);border-radius:999px;\n  }\n  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet-glow)}\n  .section-head{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;margin-bottom:56px}\n  .section-head h2{max-width: 780px}\n  .section-head p{max-width: 640px;color:var(--ink-3);font-size:17px}\n\n  /* ——— Hero ——— */\n  .hero{padding: 56px 0 100px}\n  .hero-grid{display:grid;grid-template-columns: 1.05fr 1fr; gap:72px;align-items:center}\n  @media (max-width:980px){.hero-grid{grid-template-columns:1fr;gap:40px}}\n  .hero .eyebrow{margin-bottom:8px}\n  .hero h1{margin: 18px 0 22px}\n  .hero h1 .accent{\n    background: linear-gradient(120deg, var(--ink) 0%, #C10008 40%, #E11019 70%, var(--ink) 100%);\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n  }\n  .hero-sub{font-size:19px;color:var(--ink-2);max-width:540px;margin-bottom:32px}\n  .hero-bullets{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px;padding:0}\n  .hero-bullets li{\n    list-style:none;font-size:13px;color:var(--ink-2);\n    padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(10,12,25,0.02);\n    display:flex;align-items:center;gap:8px;\n  }\n  .hero-bullets li::before{content:\"\";width:5px;height:5px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet-glow)}\n\n  /* ——— Form ——— */\n  .form-card{\n    background: #ffffff;\n    border:1px solid var(--line-2);border-radius: var(--radius);\n    padding:22px;max-width: 540px;\n    box-shadow: 0 24px 60px rgba(10,12,25,0.10), 0 2px 6px rgba(10,12,25,0.04);\n  }\n  .form-card .flabel{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}\n  .form-card .flabel em{color:var(--cyan);font-style:normal}\n  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}\n  @media (max-width:560px){.field-row{grid-template-columns:1fr}}\n  .form-card label.stack{display:block;margin-bottom:10px}\n  .form-card label.stack small{\n    display:block;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;\n    color:var(--ink-4);margin-bottom:6px;\n  }\n  .form-card input, .form-card select{\n    width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);\n    padding:13px 14px;border-radius:10px;font-size:14px;outline:none;transition:border-color .18s, box-shadow .18s;\n    appearance:none;\n  }\n  .form-card select{background-image: linear-gradient(45deg, transparent 50%, rgba(10,1
