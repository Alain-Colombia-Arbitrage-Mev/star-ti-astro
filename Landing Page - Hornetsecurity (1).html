document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

display:inline-flex; align-items:center; gap:10px;\n    padding:14px 18px 14px 14px;\n    background:#25D366; color:#0A2A14;\n    border-radius:999px;\n    font-weight:600; font-size:14.5px;\n    box-shadow: 0 20px 40px -14px rgba(37,211,102,.55), 0 6px 14px rgba(0,0,0,.12);\n    transition: transform .18s ease, box-shadow .18s ease, background .2s ease;\n    text-decoration:none;\n  }\n  .wa-fab:hover{ background:#1EBE5B; transform: translateY(-2px); box-shadow:0 24px 50px -14px rgba(37,211,102,.65), 0 8px 16px rgba(0,0,0,.15); }\n  .wa-fab svg{flex-shrink:0}\n  .wa-fab::before{\n    content:\"\"; position:absolute; inset:-6px; border-radius:999px;\n    box-shadow: 0 0 0 0 rgba(37,211,102,.6);\n    animation: wa-pulse 2.4s ease-out infinite;\n    pointer-events:none;\n  }\n  @keyframes wa-pulse{\n    0%{ box-shadow:0 0 0 0 rgba(37,211,102,.55) }\n    70%{ box-shadow:0 0 0 16px rgba(37,211,102,0) }\n    100%{ box-shadow:0 0 0 0 rgba(37,211,102,0) }\n  }\n  @media (max-width: 640px){\n    .wa-fab{ padding:14px; right:16px; bottom:78px }\n    .wa-fab .wa-label{display:none}\n  }\n\n  :root{\n    /* Base neutrals */\n    --ink: #0B0F0C;\n    --ink-2: #1B2220;\n    --ink-3: #3A4541;\n    --mute: #6B7670;\n    --mute-2: #A6AFA9;\n    --line: #E5E8E3;\n    --line-2: #EEF0EB;\n    --bg: #FFFFFF;\n    --bg-2: #F7F8F4;\n    --bg-3: #F1F3EC;\n\n    /* Hornet primary (default) */\n    --brand: #A7CB2C;        /* hornet lima */\n    --brand-2: #8FB420;\n    --brand-ink: #4E6610;    /* dark lime for text */\n    --brand-soft: #EEF5D3;\n    --accent: #B6000B;\n    --accent-ink: #8A0008;\n    --accent-soft: #FFE2E0;\n    --danger: #D93025;\n    --on-brand: #0B0F0C;     /* text on brand fill */\n\n    --radius: 14px;\n    --radius-sm: 8px;\n    --radius-lg: 22px;\n    --shadow-sm: 0 1px 0 rgba(11,15,12,.04), 0 1px 2px rgba(11,15,12,.04);\n    --shadow: 0 1px 0 rgba(11,15,12,.04), 0 8px 24px -8px rgba(11,15,12,.10);\n    --shadow-lg: 0 30px 80px -30px rgba(11,15,12,.25), 0 10px 30px -15px rgba(11,15,12,.15);\n\n    --font-sans: \"Geist\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Helvetica, Arial, sans-serif;\n    --font-serif: \"Instrument Serif\", \"Iowan Old Style\", Georgia, serif;\n    --font-mono: \"Geist Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  }\n\n  /* STAR palette — rojo distintivo #B6000B como color primario */\n  html[data-palette=\"star\"]{\n    --brand: #B6000B;\n    --brand-2: #8A0008;\n    --brand-ink: #B6000B;\n    --brand-soft: #FFE2E0;\n    --accent: #B6000B;\n    --accent-ink: #8A0008;\n    --accent-soft: #FFE2E0;\n    --on-brand: #FFFFFF;\n  }\n  /* Force red accent everywhere that var(--brand) was orange */\n  html[data-palette=\"star\"] .h1 em,\n  html[data-palette=\"star\"] .sec-title em,\n  html[data-palette=\"star\"] .stat-block .n em,\n  html[data-palette=\"star\"] .res-card.lead .cap b,\n  html[data-palette=\"star\"] .mig-note strong,\n  html[data-palette=\"star\"] .mig-note b,\n  html[data-palette=\"star\"] .cta-wrap h2 em,\n  html[data-palette=\"star\"] .feat .tag,\n  html[data-palette=\"star\"] .feat.big .tag,\n  html[data-palette=\"star\"] .plan .badge{ color:#B6000B !important }\n  html[data-palette=\"star\"] .plan .badge{ background:#1B2220 }\n  html[data-palette=\"star\"] .feat .ico{ color:#B6000B }\n  html[data-palette=\"star\"] .feat.big .ico{ background:#B6000B; color:#FFFFFF }\n  html[data-palette=\"star\"] .threat .ico{ background:#FFE2E0; color:#B6000B }\n  html[data-palette=\"star\"] .eyebrow{ color:#B6000B; background:#FFE2E0; border-color:rgba(182,0,11,.3) }\n  html[data-palette=\"star\"] .eyebrow .dot{ background:#B6000B; box-shadow:0 0 0 4px rgba(182,0,11,.25) }\n  html[data-palette=\"star\"] .ticker .d{ background:#B6000B }\n  html[data-palette=\"star\"] .fc-bar > i{ background:#B6000B }\n  html[data-palette=\"star\"] .float-card .val strong{ color:#B6000B }\n  html[data-palette=\"star\"] .trust-strip .big{ color:#0B0F0C }\n  html[data-palette=\"star\"] .plan li svg{ color:#B6000B }\n  html[data-palette=\"star\"] .step .chk{ color:#B6000B }\n  html[data-palette=\"star\"] .h1 .strike::after{ background:#B6000B; opacity:.9 }\n  html[data-palette=\"star\"] .cta-wrap::before{ background:radial-gradient(circle, #B6000B, transparent 70%); opacity:.35 }\n  html[data-palette=\"star\"] form.lead-form input:focus,\n  html[data-palette=\"star\"] form.lead-form select:focus{ border-color:#B6000B; box-shadow:0 0 0 4px rgba(182,0,11,.18) }\n  html[data-palette=\"star\"] form.lead-form input{ accent-color:#B6000B }\n  html[data-palette=\"star\"] .cta-wrap .includes li svg{ color:#B6000B }\n  html[data-palette=\"star\"] .mig-card .src{ color:#B6000B; background:#FFE2E0 }\n  html[data-palette=\"star\"] .hero-audaz .bg-fx{ background:\n    radial-gradient(ellipse 60% 60% at 80% 0%, rgba(182,0,11,.15), transparent 60%),\n    radial-gradient(ellipse 40% 40% at 0% 100%, rgba(182,0,11,.10), transparent 60%) }\n  html[data-palette=\"star\"] ::selection{ background:#B6000B; color:#fff }\n  /* Dark palette */\n  html[data-palette=\"dark\"]{\n    --ink: #F3F6F1;\n    --ink-2: #DDE2DA;\n    --ink-3: #B4BDB5;\n    --mute: #8D968E;\n    --mute-2: #5C6560;\n    --line: #1F2421;\n    --line-2: #171A18;\n    --bg: #0A0D0B;\n    --bg-2: #0F1311;\n    --bg-3: #141815;\n    --brand: #C4EA3B;\n    --brand-2: #A7CB2C;\n    --brand-ink: #D6F05C;\n    --brand-soft: #1B2410;\n    --accent: #B6000B;\n    --accent-ink: #E87A80;\n    --accent-soft: #2A0C0E;\n    --shadow-sm: 0 1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);\n    --shadow: 0 10px 30px -10px rgba(0,0,0,.6);\n    --shadow-lg: 0 30px 80px -20px rgba(0,0,0,.7);\n    --on-brand: #0A0D0B;\n  }\n\n  *,*::before,*::after{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  html{scroll-behavior:smooth; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}\n  body{\n    font-family:var(--font-sans);\n    background:var(--bg);\n    color:var(--ink);\n    font-size:17px;\n    line-height:1.55;\n    font-feature-settings:\"ss01\",\"cv11\";\n  }\n  img{max-width:100%; display:block}\n  a{color:inherit; text-decoration:none}\n  button{font:inherit; cursor:pointer}\n\n  .wrap{max-width:1240px; margin:0 auto; padding:0 28px}\n  .wrap-narrow{max-width:1040px; margin:0 auto; padding:0 28px}\n\n  /* ============ TOP BAR ============ */\n  .topbar{\n    position:sticky; top:0; z-index:50;\n    background:color-mix(in oklab, var(--bg) 88%, transparent);\n    backdrop-filter:saturate(1.4) blur(12px);\n    -webkit-backdrop-filter:saturate(1.4) blur(12px);\n    border-bottom:1px solid var(--line);\n  }\n  .topbar .row{\n    display:flex; align-items:center; justify-content:space-between;\n    height:68px; gap:24px;\n  }\n  .brand-lock{\n    display:flex; align-items:center; gap:14px;\n  }\n  .hornet-mark{\n    display:flex; align-items:center; gap:10px;\n    font-family:var(--font-sans); font-weight:700; font-size:19px; letter-spacing:-.02em;\n    color:var(--ink);\n  }\n  .hornet-mark .icn{\n    width:34px; height:34px; display:grid; place-items:center;\n    background:transparent;\n  }\n  .hornet-mark .icn img{width:100%; height:100%; object-fit:contain;\n    filter: drop-shadow(0 1px 0 rgba(0,0,0,.02));\n  }\n  .hornet-mark b{font-weight:700}\n  .divider-v{\n    width:1px; height:26px; background:var(--line);\n  }\n  .partner-tag{\n    display:flex; align-items:center; gap:10px;\n    font-size:12px; color:var(--mute); letter-spacing:.04em; text-transform:uppercase;\n  }\n  .partner-tag img{height:30px; width:auto; object-fit:contain}\n  .partner-tag span{white-space:nowrap}\n  .nav{display:flex; gap:28px; align-items:center}\n  .nav a{font-size:14.5px; color:var(--ink-2); font-weight:500}\n  .nav a:hover{color:var(--brand-ink)}\n  .nav-cta{display:flex; gap:10px; align-items:center}\n  @media (max-width: 1120px){ .partner-tag span{display:none} }\n  @media (max-width: 900px){ .nav{display:none} .divider-v{display:none} }\n\n  /* ============ BUTTONS ============ */\n  .btn{\n    display:inline-flex; align-items:center; gap:10px;\n    padding:13px 20px;\n    border-radius:999px;\n    border:1px solid transparent;\n    font-weight:600; font-size:15px;\n    transition:transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;\n    white-space:nowrap;\n  }\n  .btn:active{transform:translateY(1px)}\n  .btn-primary{\n    background:var(--ink); color:var(--bg);\n  }\n  .btn-primary:hover{background:var(--brand-ink); color:var(--bg)}\n  html[data-palette=\"dark\"] .btn-primary{background:var(--brand); color:var(--on-brand)}\n  html[data-palette=\"dark\"] .btn-primary:hover{background:var(--brand-2)}\n  .btn-ghost{\n    background:transparent; color:var(--ink-2); border-color:var(--line);\n  }\n  .btn-ghost:hover{border-color:var(--ink-3); color:var(--ink)}\n  .btn-brand{\n    background:var(--brand); color:var(--on-brand);\n  }\n  .btn-brand:hover{background:var(--brand-2)}\n  .btn-lg{padding:16px 26px; font-size:16px}\n  .btn-sm{padding:9px 14px; font-size:13.5px}\n\n  /* WhatsApp button style */\n  .btn-wa{\n    background:#25D366; color:#0A2A14;\n    border-color:transparent;\n  }\n  .btn-wa:hover{background:#1EBE5B; color:#0A2A14}\n  .btn-wa svg{flex-shrink:0}\n  @media (max-width: 640px){ .hide-sm{display:none} }\n\n  /* ============ HERO (shared scaffolding) ============ */\n  .hero{\n    padding: clamp(56px, 9vw, 120px) 0 clamp(40px, 6vw, 80px);\n    position:relative;\n    overflow:hidden;\n  }\n  .eyebrow{\n    display:inline-flex; align-items:center; gap:10px;\n    font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;\n    color:var(--brand-ink);\n    padding:7px 14px;\n    border-radius:999px;\n    background:var(--brand-soft);\n    border:1px solid color-mix(in oklab, var(--brand) 30%, transparent);\n  }\n  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 4px color-mix(in oklab, var(--brand) 25%, transparent);}\n\n  .h1{\n    font-family:var(--font-serif);\n    font-size: clamp(44px, 7.4vw, 108px);\n    line-height:0.95;\n    letter-spacing:-0.02em;\n    font-weight:400;\n    color:var(--ink);\n    margin:0;\n  }\n  .h1 em{font-style:italic; color:var(--brand-ink)}\n  html[data-palette=\"dark\"] .h1 em{color:var(--brand)}\n  .h1 .strike{position:relative; white-space:nowrap}\n  .h1 .strike::after{\n    content:\"\"; position:absolute; left:-2%; right:-2%; top:58%; height:7%;\n    background:var(--accent);\n    transform:skewY(-2.5deg);\n    opacity:.85;\n    z-index:-1;\n    border-radius:2px;\n  }\n  .lede{\n    font-size: clamp(17px, 1.45vw, 21px);\n    color:var(--ink-3);\n    line-height:1.55;\n    max-width:58ch;\n    margin:26px 0 0;\n  }\n  .cta-row{display:flex; gap:12px; margin-top:36px; flex-wrap:wrap}\n  .mini-row{display:flex; flex-wrap:wrap; gap:22px 28px; margin-top:28px; color:var(--mute); font-size:14px}\n  .mini-row span{display:inline-flex; align-items:center; gap:8px}\n  .mini-row svg{flex-shrink:0}\n\n  /* HERO — CONSERVADOR (editorial, mucho blanco) */\n  .hero-conservador .hero-grid{\n    display:grid; grid-template-columns: 1.15fr .85fr; gap: 56px; align-items:end;\n  }\n  .hero-conservador .rightcol{\n    position:relative; padding-bottom:12px;\n  }\n  .trust-strip{\n    display:flex; align-items:center; gap:20px;\n    padding:18px 20px; border:1px solid var(--line); border-radius:var(--radius);\n    background:var(--bg-2);\n  }\n  .trust-strip .big{\n    font-family:var(--font-serif); font-size:44px; line-height:1; color:var(--ink); font-weight:400;\n  }\n  .trust-strip .lbl{font-size:12.5px; color:var(--mute); letter-spacing:.02em; line-height:1.3}\n  .trust-strip .div{width:1px; align-self:stretch; background:var(--line)}\n\n  .hero-conservador .card-stack{\n    position:relative; margin-top:26px;\n    height:300px;\n  }\n  .float-card{\n    position:absolute;\n    background:var(--bg);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    box-shadow:var(--shadow);\n    padding:16px 18px;\n  }\n  .float-card .lbl{font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.1em; font-weight:600}\n  .float-card .val{font-family:var(--font-mono); font-size:15px; margin-top:6px; color:var(--ink); font-weight:500}\n  .float-card .val strong{color:var(--brand-ink); font-weight:600}\n  .fc-1{ left:0; top:0; width:240px; transform:rotate(-1.5deg) }\n  .fc-2{ right:0; top:46px; width:260px; transform:rotate(1deg) }\n  .fc-3{ left:40px; bottom:0; width:260px; transform:rotate(.5deg) }\n  .fc-4{ right:30px; bottom:30px; width:220px; transform:rotate(-.8deg) }\n  .fc-bar{\n    height:6px; background:var(--line-2); border-radius:4px; margin-top:10px; overflow:hidden;\n  }\n  .fc-bar > i{display:block; height:100%; background:var(--brand); border-radius:4px}\n\n  /* HERO — AUDAZ (statement, dramatic) */\n  .hero-audaz .bg-fx{\n    position:absolute; inset:0; z-index:0; pointer-events:none;\n    background:\n      radial-gradient(ellipse 60% 60% at 80% 0%, color-mix(in oklab, var(--brand) 22%, transparent), transparent 60%),\n      radial-gradient(ellipse 40% 40% at 0% 100%, color-mix(in oklab, var(--accent) 14%, transparent), transparent 60%);\n  }\n  .hero-audaz .bg-grid{\n    position:absolute; inset:0; z-index:0; pointer-events:none;\n    background-image:\n      linear-gradient(to right, var(--line) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--line) 1px, transparent 1px);\n    background-size: 80px 80px;\n    opacity:.5;\n    mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 40%, transparent 85%);\n  }\n  .hero-audaz .inner{position:relative; z-index:1}\n  .hero-audaz .h1{\n    font-size: clamp(52px, 9.2vw, 140px);\n    text-align:center;\n  }\n  .hero-audaz .eyebrow-wrap{display:flex; justify-content:center}\n  .hero-audaz .lede{margin:30px auto 0; text-align:center}\n  .hero-audaz .cta-row{justify-content:center}\n  .hero-audaz .mini-row{justify-content:center}\n\n  .ticker{\n    margin-top:72px;\n    border-top:1px solid var(--line);\n    border-bottom:1px solid var(--line);\n    padding:18px 0;\n    display:flex; align-items:center; gap:48px;\n    overflow:hidden;\n    white-space:nowrap;\n    color:var(--mute);\n    font-size:13px; letter-spacing:.08em; text-transform:uppercase;\n  }\n  .ticker-track{display:inline-flex; gap:48px; animation: ticker 40s linear infinite}\n  .ticker span{display:inline-flex; align-items:center; gap:10px}\n  .ticker .d{width:4px; height:4px; border-radius:50%; background:var(--brand)}\n  @keyframes ticker{ from{transform:translateX(0)} to{transform:translateX(-50%)} }\n\n  /* ============ VARIANT SWITCHER ============ */\n  .variant-switch{\n    position:fixed; left:50%; transform:translateX(-50%);\n    bottom:18px; z-index:60;\n    background:var(--ink); color:var(--bg);\n    padding:6px; border-radius:999px;\n    display:inline-flex; gap:4px;\n    box-shadow:var(--shadow-lg);\n    font-size:13px;\n  }\n  .variant-switch button{\n    background:transparent; border:0; color:var(--mute-2); padding:9px 18px; border-radius:999px;\n    font-weight:500;\n  }\n  .variant-switch button.on{background:var(--brand); color:var(--on-brand); font-weight:600}\n\n  [data-hero=\"conservador\"] .hero-audaz,\n  [data-hero=\"audaz\"] .hero-conservador{display:none}\n\n  /* ============ SECTIONS ============ */\n  section{padding: clamp(72px, 9vw, 130px) 0; position:relative}\n  .sec-eyebrow{\n    font-family:var(--font-mono);\n    font-size:12px; text-transform:uppercase; letter-spacing:.12em;\n    color:var(--mute); margin-bottom:18px;\n    display:inline-flex; align-items:center; gap:10px;\n  }\n  .sec-eyebrow::before{content:\"\"; width:24px; height:1px; background:var(--ink-3)}\n  .sec-title{\n    font-family:var(--font-serif);\n    font-size: clamp(36px, 5vw, 64px);\n    font-weight:400; line-height:1.02; letter-spacing:-.02em;\n    margin:0 0 18px; color:var(--ink);\n  }\n  .sec-title em{font-style:italic; color:var(--brand-ink)}\n  html[data-palette=\"dark\"] .sec-title em{color:var(--brand)}\n  .sec-lede{color:var(--ink-3); font-size:18px; max-width:62ch; line-height:1.55}\n\n  /* ============ PROBLEMA / AMENAZAS ============ */\n  .section-threats{background:var(--bg-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}\n  .threat-lede{\n    display:grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items:end;\n    margin-bottom:56px;\n  }\n  .stat-block{\n    display:flex; align-items:baseline; gap:20px;\n    padding:26px 0; border-top:1px solid var(--line);\n  }\n  .stat-block:last-child{border-bottom:1px solid var(--line)}\n  .stat-block .n{\n    font-family:var(--font-serif); font-size:clamp(56px,6vw,88px); line-height:.9; color:var(--ink);\n    font-weight:400; min-width:180px;\n  }\n  .stat-block .n em{font-style:italic; color:var(--brand-ink)}\n  .stat-block p{margin:0; color:var(--ink-3); font-size:16px; line-height:1.5; max-width:42ch}\n  .threats-grid{\n    display:grid; grid-template-columns: repeat(4, 1fr); gap:1px;\n    background:var(--line); border:1px solid var(--line); border-radius:var(--radius);\n    overflow:hidden;\n  }\n  .threat{\n    background:var(--bg); padding:26px 24px; min-height:170px;\n    display:flex; flex-direction:column; gap:14px; transition:background .2s;\n  }\n  .threat:hover{background:var(--bg-3)}\n  .threat .ico{\n    width:40px; height:40px; border-radius:10px;\n    display:grid; place-items:center; background:var(--brand-soft); color:var(--brand-ink);\n  }\n  .threat h4{margin:0; font-size:16px; font-weight:600; color:var(--ink); letter-spacing:-.01em}\n  .threat p{margin:0; font-size:14px; color:var(--mute); line-height:1.5}\n\n  @media(max-width:900px){ .threats-grid{grid-template-columns:repeat(2,1fr)} .threat-lede{grid-template-columns:1fr} }\n\n  /* ============ DIFERENCIADORES / FEATURES ============ */\n  .features-intro{\n    display:grid; grid-template-columns: .9fr 1.1fr; gap:56px; align-items:end; margin-bottom:56px;\n  }\n  .features-grid{\n    display:grid; grid-template-columns: repeat(12, 1fr); gap:20px;\n  }\n  .feat{\n    grid-column: span 4;\n    background:var(--bg-2);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    padding:28px;\n    display:flex; flex-direction:column; gap:14px;\n    min-height:250px;\n    transition:transform .2s ease, box-shadow .2s ease;\n  }\n  .feat:hover{transform:translateY(-3px); box-shadow:var(--shadow)}\n  .feat .ico{\n    width:46px; height:46px; border-radius:12px;\n    background:var(--ink); color:var(--brand);\n    display:grid; place-items:center;\n  }\n  html[data-palette=\"dark\"] .feat .ico{background:var(--brand); color:var(--on-brand)}\n  .feat h3{margin:0; font-size:20px; font-weight:600; letter-spacing:-.015em; color:var(--ink)}\n  .feat p{margin:0; color:var(--ink-3); font-size:15px; line-height:1.55}\n  .feat.big{grid-column: span 6; background:var(--ink); color:var(--bg); border-color:var(--ink)}\n  .feat.big h3, .feat.big p{color:var(--bg)}\n  .feat.big p{color:var(--mute-2)}\n  .feat.big .ico{background:var(--brand); color:var(--on-brand)}\n  .feat.wide{grid-column:span 8}\n  html[data-palette=\"dark\"] .feat.big{background:var(--bg-3); border-color:var(--line)}\n\n  .feat .tag{\n    display:inline-flex; align-items:center; gap:6px;\n    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em;\n    color:var(--brand-ink);\n    margin-top:auto;\n  }\n  html[data-palette=\"dark\"] .feat .tag{color:var(--brand)}\n  .feat.big .tag{color:var(--brand)}\n\n  @media(max-width:900px){ .feat, .feat.big, .feat.wide{grid-column:span 12} .features-intro{grid-template-columns:1fr} }\n\n  /* ============ CÓMO FUNCIONA (4 pasos) ============ */\n  .section-how{background:var(--bg-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}\n  .how-grid{\n    display:grid; grid-template-columns: repeat(4, 1fr); gap:0;\n    margin-to
